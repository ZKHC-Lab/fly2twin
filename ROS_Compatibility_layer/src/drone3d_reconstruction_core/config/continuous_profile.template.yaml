# Continuous session scheduler profile.
#
# `roles` is loaded by continuous_session.launch from the front/down capture
# profiles, not from this file.
reconstruct_action: "/reconstruct/reconstruct_segment"
service_name: "/continuous_session/command"
diagnostics_topic: "/diagnostics"
diagnostics_period_sec: 1.0
journal_root: "/REPLACE_ME/session_journal"
result_root: "/REPLACE_ME/results"
min_free_disk_gb: 2.0
# Automatic cleanup at node start and after STOP_ALL: the newest
# retention_max_sessions sessions are kept; an older session is deleted only when
# its delivery package was exported and still verifies, otherwise it is kept and
# reported on /diagnostics (docs/ONBOARD_V1.md, section 3).
retention_max_sessions: 3
# Unreferenced worker results and leftover staging directories older than this.
retention_orphan_grace_sec: 86400.0
action_connect_timeout_sec: 10.0
capture_wait_margin_sec: 30.0
reconstruct_wait_timeout_sec: 3600.0
stop_timeout_sec: 120.0
# Single-command production start: nodes report ready first, then the
# scheduler automatically selects initial_role and starts the session.
auto_start_session: true
initial_role: "front"
auto_start_delay_sec: 2.0
# Must equal the reconstruct profile frame_group_size. window_frames above
# this value is rejected: no silent frame subsampling.
alignment_backend: "global_g4"
reconstruct_frame_group_size: 16
initial_sample_fps: 5.0
# Frames per reconstruction window; fixed for the session.
initial_window_frames: 16
# Number of trailing frames reused in the next window; global_g4 needs at least 5.
initial_overlap_frames: 5
# Placement on the global_g4 backend: each frame is placed with its
# localization camera pose; VGGT supplies depth and the metric scale.
# See docs/ONBOARD_V1.md.
g4_placement: "frame_pose"
# frame_pose only: localization pose is taken at RGB time + this offset (ms).
# Measured on the D435i + FAST-LIO rig: +40 ms (NX bench and bag replay profiles,
# with pose_time_offset_stage capture).
pose_time_offset_ms: 0.0
# capture: the capture node applied the offset; snapshots must carry the same value.
# backend: the map backend interpolates at RGB time + offset. drone3d_onboard.export
# only accepts capture, so sessions run with backend cannot be exported.
pose_time_offset_stage: backend
# Web only: multiview-consistent fusion for the live cloud (the Web node must also
# enable it); false keeps the old per-window display. The map backend ignores it.
frame_pose_fusion: false
# frame_pose window scales: weight of each cross-window overlapping-frame depth row
# (0 = trajectory prior + adjacent shared frames only). Needs pose_time_offset_stage
# capture. The NX bench and bag replay profiles leave it 0 and use g4_frame_scales.
g4_cross_window_weight: 0.0
# frame_pose: one depth scale per frame, solved jointly from frame-pair depth rows inside
# and across windows (needs capture stage and g4_cross_window_weight 0); false = one
# scale per window. The NX bench and bag replay profiles set true. See docs/ONBOARD_V1.md.
g4_frame_scales: false
# frame_pose only: calibrated pinhole of the source RGB image. Unset uses the
# snapshot CameraInfo; without either the backend falls back to VGGT's own K,
# which was clearly worse outdoors.
# camera_intrinsics: {width: 640, height: 480, fx: 604.195618, fy: 604.016418, cx: 318.986664, cy: 247.538086}
initial_queue_mode: "lossless_fifo"
# Pending high-water mark: lossless pauses new captures at this threshold, and
# every frame that arrives while paused is lost for the whole delivery. Keep it
# large so that only min_free_disk_gb limits a flight: when reconstruction is
# slower than capture the backlog queues on disk and drains after landing.
initial_queue_capacity: 1000
initial_max_retries: 0
initial_keep_snapshot_on_success: true
# Inference resolution of every window; global_g4 needs a multiple of 16.
initial_inference_resolution: 384
initial_worker_timeout_sec: 0.0
# Fixed for each session; per_window is the only mode.
initial_reconstruction_mode: "per_window"
# Target Web (WP8). The production Web node reuses this same profile.
# web_host: keep 127.0.0.1 unless the NX is on a trusted intranet; set
# 0.0.0.0 ONLY to allow other hosts on that intranet to connect. The Web
# has no authentication by design and must never be exposed publicly.
web_host: "127.0.0.1"
web_port: 8080
# Web preview frame rate; independent from and hot-tunable separately from
# the reconstruction sample_fps. The Web UI can adjust this at runtime.
web_preview_fps: 5.0
# Optional Web tuning, read only by the Web node. If omitted the node uses its code
# defaults; conf_percentile defaults to 20, but the old display path always uses 50
# for G4 windows.
max_point_cloud_points: 1000000
max_session_windows: 64
conf_percentile: 50.0
# Upper bound for a single predictions.npz read. 2 GiB is generous for the
# real multi-frame Omega arrays (typically tens of MB) while keeping the
# trusted-intranet Web from being asked to read an unreasonable file.
max_predictions_bytes: "2147483648"
