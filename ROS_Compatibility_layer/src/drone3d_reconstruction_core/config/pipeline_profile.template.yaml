# Camera pipeline upper-layer service runtime profile.
#
# The `roles` entries are NOT listed here: camera_pipeline_service.launch
# loads the front/down capture profile YAML files into ~roles/front and
# ~roles/down, so every configured data source has exactly one profile.
service_name: "/camera_pipeline/command"
reconstruct_action: "/reconstruct/reconstruct_segment"
diagnostics_topic: "/diagnostics"
diagnostics_period_sec: 1.0
action_connect_timeout_sec: 10.0
capture_wait_margin_sec: 30.0
# Must equal the reconstruct profile frame_group_size. START_TASK rejects
# max_frames above this value: no silent frame subsampling downstream.
reconstruct_frame_group_size: 8
# Must cover the reconstruct profile worker_timeout_sec + verifier_timeout_sec
# + a process-lifecycle margin. This is an upper-layer watchdog only; the
# underlying Reconstruct Action remains the authoritative lifecycle owner.
reconstruct_wait_timeout_sec: 3600.0
