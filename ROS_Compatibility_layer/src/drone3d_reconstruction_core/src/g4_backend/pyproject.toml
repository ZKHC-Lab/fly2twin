[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drone3d-g4-backend"
version = "0.1.0"
description = "ROS-independent extraction of the frozen VGGT-Omega G4 backend"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[tool.setuptools]
packages = ["g4_backend"]
package-dir = {g4_backend = "."}
