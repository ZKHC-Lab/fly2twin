# Phone video: drone depth/fusion method, poses from the VGGT windows (pose.provider: vggt), assumed walking speed.
protocol: phone
video: scene/video.MOV
output: ../../outputs/phone_b0
extract:
  # 400 x 3 = 1200 equal timeline bins, sharpest frame per bin (no motion criterion);
  # poses and training use the same frames. Frames are always scaled to long_edge.
  target_frames: 400
  min_frames: 200
  sfm_multiple: 3
  train_subset: all
  long_edge: 1920
  scan_width: 640
  quality: 2
  hdr: auto
sfm:
  camera_model: SIMPLE_RADIAL
  focal_factor: 1.2
  overlap: 20
  loop_keyframes: 60
  loop_max_pairs: 600
  # 2048 features per frame: same quality as 8192 on the three videos tried, BA three to five times faster.
  max_features: 2048
  threads: 8
pose:
  provider: vggt
  refine: none
  metric:
    # Assumed, not measured: metres in all later stages come from this walking speed.
    speed_mps: 1.0
split:
  mode: holdout
  exclude_blur: false
depth:
  weights: models/vggt_omega_1b_512.pt
  resolution: [512, 288]
  first_window: 40
  new_frames: 30
  overlap: 10
fusion:
  max_points: 1000000
train:
  aniso_lambda: 0.1
  depth_lambda: 0.1
  discard_initial_permutation: true
  exact_steps: true
  image_cache_frames: 1200
  max_width: 1600  # 1920x1080 frames train at 1600x900
  reset_at_zero: true
  scale_densification: true
  schedule_rounding: round
  seed: 42
eval:
  aligned_width: 960
  alignment_steps: 200
