# Example calibration for the measured S380/D435i assembly only; not a universal default.
manifest: scene/manifest.json
body_poses: scene/body_poses.npz
output: ../../outputs/s380
time_offset_ms: 40
# T_BC maps optical camera coordinates into body coordinates.
# Translation m: [0.056558, -0.006717, -0.077751]
# Quaternion xyzw: [-0.494176, 0.506142, -0.498990, 0.500618]
# Matrix generated from the normalized quaternion; see recon/docs/INPUTS.md.
body_from_camera:
  - [-0.010342453239346627, -0.0006397069548152445, 0.9999463107767356, 0.056558]
  - [-0.9998541643207508, 0.013597179995076897, -0.010332801490130883, -0.006717]
  - [-0.013589840008068399, -0.9999073494435338, -0.0007802418610030615, -0.077751]
  - [0, 0, 0, 1]
keyframes:
  enabled: true
  translation_m: 0.15
  rotation_deg: 8
  max_gap_s: 2
  trim_static: true
pose:
  provider: external
  refine: ba
  units: meters
  position_sigma_m: 0.05
  xfeat_weights: models/xfeat.pt
  batch_size: 8
depth:
  weights: models/vggt_omega_1b_512.pt
  resolution: [512, 288]
  new_frames: 30
  overlap: 10
fusion:
  max_points: 300000
  revisit: true
train:
  seed: 42
  resolution: [640, 360]
  depth_lambda: 0.1
  aniso_lambda: 0.1
eval:
  alignment_steps: 200
